<svg id="svg-exhibit-6-3" class="diagram-svg" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
  </defs>
  <rect x="390" y="14" width="350" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="42" fill="#1e3a8a" font-weight="800" font-size="13" text-anchor="middle">المحددات الفردية</text>
  <text x="565" y="72" fill="#334155" font-size="10" text-anchor="middle">• مرحلة النضج الأخلاقي: الارتقاء من</text>
  <text x="565" y="90" fill="#334155" font-size="10" text-anchor="middle">المنفعة الشخصية إلى المبادئ الكونية</text>
  <text x="565" y="118" fill="#334155" font-size="10" text-anchor="middle">• القيم وقوة الأنا: صلابة الإرادة</text>
  <text x="565" y="136" fill="#334155" font-size="10" text-anchor="middle">ومقاومة الضغوط</text>
  <text x="565" y="164" fill="#334155" font-size="10" text-anchor="middle">• موضع الضبط: الإيمان بالمسؤولية</text>
  <text x="565" y="182" fill="#334155" font-size="10" text-anchor="middle">الفردية (داخلي) مقابل الحظ (خارجي)</text>
  <rect x="430" y="196" width="270" height="0" rx="0" fill="none"/>
  <rect x="20" y="14" width="350" height="200" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="195" y="42" fill="#0f766e" font-weight="800" font-size="13" text-anchor="middle">المحددات التنظيمية والسياقية</text>
  <text x="195" y="72" fill="#334155" font-size="10" text-anchor="middle">• المتغيرات الهيكلية: وضوح القواعد،</text>
  <text x="195" y="90" fill="#334155" font-size="10" text-anchor="middle">والتقييم العادل، والقدوة الحية</text>
  <text x="195" y="118" fill="#334155" font-size="10" text-anchor="middle">• ثقافة المنظمة: معايير النزاهة</text>
  <text x="195" y="136" fill="#334155" font-size="10" text-anchor="middle">الراسخة والشفافية</text>
  <text x="195" y="164" fill="#334155" font-size="10" text-anchor="middle">• حدة المشكلة الأخلاقية: جسامة الأثر</text>
  <text x="195" y="182" fill="#334155" font-size="10" text-anchor="middle">وحجم الإجماع المجتمعي</text>
  <rect x="230" y="232" width="300" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="249" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">(Factors Determining Ethical Behavior)</text>
</svg>