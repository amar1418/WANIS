<svg id="svg-exhibit-7-2" class="diagram-svg" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#be123c"/><stop offset="100%" stop-color="#fb7185"/></linearGradient>
  </defs>
  <rect x="390" y="14" width="350" height="200" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
  <text x="565" y="42" fill="#0c4a6e" font-weight="800" font-size="13" text-anchor="middle">استعارة المياه الهادئة (Calm Waters)</text>
  <text x="565" y="72" fill="#334155" font-size="10" text-anchor="middle">الافتراض: بيئة مستقرة وقابلة للتنبؤ</text>
  <text x="565" y="100" fill="#334155" font-size="10" text-anchor="middle">طبيعة التغيير: حدث عارض ومؤقت يفصل</text>
  <text x="565" y="118" fill="#334155" font-size="10" text-anchor="middle">بين فترتين طويلتين من الهدوء</text>
  <rect x="430" y="136" width="270" height="56" rx="10" fill="url(#g1)"/>
  <text x="565" y="158" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">النموذج: دورة كورت ليفين</text>
  <text x="565" y="178" fill="#e0f2fe" font-size="10" text-anchor="middle">إذابة الجليد ← التحرك ← إعادة التجميد</text>
  <rect x="20" y="14" width="350" height="200" rx="12" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="195" y="42" fill="#be123c" font-weight="800" font-size="13" text-anchor="middle">استعارة منحدرات النهر الجارف</text>
  <text x="195" y="60" fill="#fb7185" font-size="10.5" text-anchor="middle">(White-Water Rapids)</text>
  <text x="195" y="88" fill="#334155" font-size="10" text-anchor="middle">الافتراض: بيئة ديناميكية شديدة الاضطراب</text>
  <text x="195" y="106" fill="#334155" font-size="10" text-anchor="middle">ومعدومة الاستقرار</text>
  <text x="195" y="134" fill="#334155" font-size="10" text-anchor="middle">طبيعة التغيير: حالة تشغيلية دائمة، وتدفق</text>
  <text x="195" y="152" fill="#334155" font-size="10" text-anchor="middle">لا ينقطع من المفاجآت والتحولات</text>
  <rect x="60" y="168" width="270" height="24" rx="12" fill="url(#g2)"/>
  <text x="195" y="184" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">المتطلب: مرونة قصوى واستجابة فورية</text>
  <rect x="230" y="232" width="300" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="249" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">(Calm Waters vs. White-Water Rapids)</text>
</svg>