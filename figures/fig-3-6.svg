  <text x="380" y="162" fill="#ffffff" font-weight="800" font-size="12.5" text-anchor="middle">المحصلة: ثقافة تنظيمية راسخة</text>
  <text x="380" y="182" fill="#dbeafe" font-size="10.5" text-anchor="middle">توجه قرارات التخطيط والتنظيم والقيادة والرقابة</text>
