  <rect x="575" y="14" width="170" height="100" rx="10" fill="url(#g1)"/>
  <text x="660" y="42" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">1. فلسفة المؤسسين</text>
  <text x="660" y="64" fill="#dbeafe" font-size="9.5" text-anchor="middle">القيم الأولى والرؤية</text>
  <text x="660" y="80" fill="#dbeafe" font-size="9.5" text-anchor="middle">التأسيسية التي انطلقت</text>
  <text x="660" y="96" fill="#dbeafe" font-size="9.5" text-anchor="middle">منها المنشأة</text>
  <rect x="385" y="14" width="170" height="100" rx="10" fill="url(#g2)"/>
  <text x="470" y="42" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">2. معايير الاختيار</text>
  <text x="470" y="64" fill="#eff6ff" font-size="9.5" text-anchor="middle">استقطاب الكفاءات</text>
  <text x="470" y="80" fill="#eff6ff" font-size="9.5" text-anchor="middle">المتوافقة مع المنظومة</text>
  <text x="470" y="96" fill="#eff6ff" font-size="9.5" text-anchor="middle">القيمية للمنظمة</text>
  <rect x="195" y="14" width="170" height="100" rx="10" fill="url(#g3)"/>
  <text x="280" y="42" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">3. سلوك الإدارة العليا</text>
  <text x="280" y="64" fill="#f0f9ff" font-size="9.5" text-anchor="middle">القدوة القيادية الحية</text>
  <text x="280" y="80" fill="#f0f9ff" font-size="9.5" text-anchor="middle">في تجسيد المبادئ</text>
  <text x="280" y="96" fill="#f0f9ff" font-size="9.5" text-anchor="middle">وترسيخها</text>
  <rect x="5" y="14" width="170" height="100" rx="10" fill="url(#g4)"/>
  <text x="90" y="42" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">4. التنشئة التنظيمية</text>
  <text x="90" y="64" fill="#ccfbf1" font-size="9.5" text-anchor="middle">دمج الموظفين الجدد عبر</text>
  <text x="90" y="80" fill="#ccfbf1" font-size="9.5" text-anchor="middle">القصص والطقوس والرموز</text>
  <text x="90" y="96" fill="#ccfbf1" font-size="9.5" text-anchor="middle">واللغة</text>
