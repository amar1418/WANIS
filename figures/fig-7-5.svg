  <rect x="520" y="14" width="220" height="210" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="42" fill="#1e3a8a" font-weight="800" font-size="12.5" text-anchor="middle">المتغيرات الهيكلية (Structural)</text>
  <text x="630" y="72" fill="#334155" font-size="10" text-anchor="middle">• هياكل عضوية مرنة ولامركزية</text>
  <text x="630" y="96" fill="#334155" font-size="10" text-anchor="middle">• وفرة الموارد المخصصة للتجريب</text>
  <text x="630" y="120" fill="#334155" font-size="10" text-anchor="middle">• تواصل سلس بين مختلف الوحدات</text>
  <text x="630" y="144" fill="#334155" font-size="10" text-anchor="middle">• تجنب ضغوط الوقت الخانقة</text>
  <text x="630" y="168" fill="#334155" font-size="10" text-anchor="middle">في الابتكار</text>
  <rect x="270" y="14" width="220" height="210" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="380" y="42" fill="#0f766e" font-weight="800" font-size="12.5" text-anchor="middle">المتغيرات الثقافية (Cultural)</text>
  <text x="380" y="72" fill="#334155" font-size="10" text-anchor="middle">• تقبل الغموض والمفاجآت الفكرية</text>
  <text x="380" y="96" fill="#334155" font-size="10" text-anchor="middle">• التسامح التام مع الإخفاقات</text>
  <text x="380" y="120" fill="#334155" font-size="10" text-anchor="middle">غير المقصودة</text>
  <text x="380" y="144" fill="#334155" font-size="10" text-anchor="middle">• التركيز على المآلات والمخرجات</text>
  <text x="380" y="168" fill="#334155" font-size="10" text-anchor="middle">• تحفيز وتغذية راجعة إيجابية</text>
  <rect x="20" y="14" width="220" height="210" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="42" fill="#b45309" font-weight="800" font-size="12.5" text-anchor="middle">الموارد البشرية (HR)</text>
  <text x="130" y="72" fill="#334155" font-size="10" text-anchor="middle">• تدريب مكثف على التفكير الإبداعي</text>
  <text x="130" y="96" fill="#334155" font-size="10" text-anchor="middle">• توفير الأمان المهني المحفز</text>
  <text x="130" y="120" fill="#334155" font-size="10" text-anchor="middle">للجسارة</text>
  <text x="130" y="144" fill="#334155" font-size="10" text-anchor="middle">• رعاية أبطال الأفكار</text>
  <text x="130" y="168" fill="#334155" font-size="10" text-anchor="middle">(Idea Champions)</text>
  <text x="130" y="192" fill="#334155" font-size="10" text-anchor="middle">• مكافأة المبادرات الابتكارية</text>
  <text x="130" y="210" fill="#334155" font-size="10" text-anchor="middle">المتميزة</text>
