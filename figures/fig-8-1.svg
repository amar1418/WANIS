<svg id="svg-exhibit-8-1" class="diagram-svg" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
  </defs>
  <rect x="390" y="14" width="350" height="110" rx="10" fill="url(#g1)"/>
  <text x="565" y="40" fill="#ffffff" font-weight="800" font-size="13" text-anchor="middle">1. التخطيط (Planning)</text>
  <text x="565" y="62" fill="#dbeafe" font-size="10" text-anchor="middle">تحديد الأهداف والاستراتيجيات</text>
  <text x="565" y="80" fill="#dbeafe" font-size="10" text-anchor="middle">ووضع الخطط الشاملة</text>
  <text x="565" y="98" fill="#dbeafe" font-size="10" text-anchor="middle">وتقسيم الأنشطة</text>
  <rect x="20" y="14" width="350" height="110" rx="10" fill="url(#g2)"/>
  <text x="195" y="40" fill="#ffffff" font-weight="800" font-size="13" text-anchor="middle">2. التنظيم (Organizing)</text>
  <text x="195" y="62" fill="#eff6ff" font-size="10" text-anchor="middle">ترتيب المهام والموارد</text>
  <text x="195" y="80" fill="#eff6ff" font-size="10" text-anchor="middle">وتصميم الهيكل التنظيمي</text>
  <text x="195" y="98" fill="#eff6ff" font-size="10" text-anchor="middle">وتوزيع الصلاحيات</text>
  <rect x="390" y="144" width="350" height="110" rx="10" fill="url(#g3)"/>
  <text x="565" y="170" fill="#ffffff" font-weight="800" font-size="13" text-anchor="middle">3. القيادة (Leading)</text>
  <text x="565" y="192" fill="#f0f9ff" font-size="10" text-anchor="middle">توجيه وتحفيز الأفراد</text>
  <text x="565" y="210" fill="#f0f9ff" font-size="10" text-anchor="middle">وتفعيل التواصل</text>
  <text x="565" y="228" fill="#f0f9ff" font-size="10" text-anchor="middle">وحل النزاعات</text>
  <rect x="20" y="144" width="350" height="110" rx="10" fill="url(#g4)"/>
  <text x="195" y="170" fill="#ffffff" font-weight="800" font-size="13" text-anchor="middle">4. الرقابة (Controlling)</text>
  <text x="195" y="192" fill="#ccfbf1" font-size="10" text-anchor="middle">قياس الأداء الفعلي</text>
  <text x="195" y="210" fill="#ccfbf1" font-size="10" text-anchor="middle">ومقارنته بالمعايير</text>
  <text x="195" y="228" fill="#ccfbf1" font-size="10" text-anchor="middle">وتصحيح الانحرافات</text>
  <text x="380" y="262" fill="#64748b" font-size="10.5" text-anchor="middle">(The Four Functions of Management)</text>
</svg>