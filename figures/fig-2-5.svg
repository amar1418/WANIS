<svg id="svg-exhibit-2-5" class="diagram-svg" viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#be123c"/><stop offset="100%" stop-color="#fb7185"/></linearGradient>
  </defs>
  <rect x="520" y="14" width="220" height="150" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="630" y="42" fill="#065f46" font-weight="800" font-size="13" text-anchor="middle">1. التأكد التام (Certainty)</text>
  <text x="630" y="68" fill="#334155" font-size="10" text-anchor="middle">بيئة مثالية تتوافر فيها جميع</text>
  <text x="630" y="86" fill="#334155" font-size="10" text-anchor="middle">المعلومات اللازمة، وتُعرف نتائج</text>
  <text x="630" y="104" fill="#334155" font-size="10" text-anchor="middle">كل بديل يقيناً دون احتمال خطأ</text>
  <rect x="560" y="120" width="140" height="24" rx="12" fill="url(#g1)"/>
  <text x="630" y="136" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">أدنى مستوى عدم تأكد</text>
  <rect x="270" y="14" width="220" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="42" fill="#b45309" font-weight="800" font-size="13" text-anchor="middle">2. المخاطرة (Risk)</text>
  <text x="380" y="68" fill="#334155" font-size="10" text-anchor="middle">النتائج غير مؤكدة، لكن يستطيع</text>
  <text x="380" y="86" fill="#334155" font-size="10" text-anchor="middle">المدير تقدير احتمالات وقوع كل</text>
  <text x="380" y="104" fill="#334155" font-size="10" text-anchor="middle">عائد استناداً للبيانات التاريخية</text>
  <rect x="310" y="120" width="140" height="24" rx="12" fill="url(#g2)"/>
  <text x="380" y="136" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">حساب القيمة المتوقعة</text>
  <rect x="20" y="14" width="220" height="150" rx="12" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="130" y="42" fill="#be123c" font-weight="800" font-size="13" text-anchor="middle">3. عدم التأكد (Uncertainty)</text>
  <text x="130" y="68" fill="#334155" font-size="10" text-anchor="middle">غياب تام للمعلومات والاحتمالات؛</text>
  <text x="130" y="86" fill="#334155" font-size="10" text-anchor="middle">ويحكم القرار خيارات سلوكية:</text>
  <text x="130" y="104" fill="#334155" font-size="10" text-anchor="middle">التفاؤل أو التحفظ أو تقليل الندم</text>
  <rect x="60" y="120" width="140" height="24" rx="12" fill="url(#g3)"/>
  <text x="130" y="136" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">أقصى مستوى عدم تأكد</text>
  <rect x="230" y="186" width="300" height="36" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="209" fill="#1e3a8a" font-weight="700" font-size="11.5" text-anchor="middle">من اليقين الكامل إلى الغموض التام (Certainty → Uncertainty)</text>
</svg>