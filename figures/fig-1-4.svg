<svg id="svg-exhibit-1-4" class="diagram-svg" viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <rect x="520" y="14" width="220" height="34" rx="8" fill="url(#g1)"/>
  <text x="630" y="36" fill="#ffffff" font-weight="800" font-size="12.5" text-anchor="middle">الأدوار التفاعلية (Interpersonal)</text>
  <rect x="520" y="58" width="220" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="630" y="80" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">الممثل الرمزي (Figurehead)</text>
  <text x="630" y="98" fill="#475569" font-size="10" text-anchor="middle">الواجبات الرسمية والتشريفية والقانونية</text>
  <text x="630" y="112" fill="#475569" font-size="10" text-anchor="middle">والتمثيل الخارجي للمنظمة</text>
  <rect x="520" y="128" width="220" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="630" y="150" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">القائد (Leader)</text>
  <text x="630" y="168" fill="#475569" font-size="10" text-anchor="middle">تحفيز العاملين وتوجيه جهودهم</text>
  <text x="630" y="182" fill="#475569" font-size="10" text-anchor="middle">وتدريبهم وتطويرهم</text>
  <rect x="520" y="198" width="220" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="630" y="220" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">ضابط الاتصال (Liaison)</text>
  <text x="630" y="238" fill="#475569" font-size="10" text-anchor="middle">نسج شبكة من العلاقات المفيدة</text>
  <text x="630" y="252" fill="#475569" font-size="10" text-anchor="middle">خارج الوحدة والمنظمة</text>
  <rect x="270" y="14" width="220" height="34" rx="8" fill="url(#g2)"/>
  <text x="380" y="36" fill="#ffffff" font-weight="800" font-size="12.5" text-anchor="middle">الأدوار المعلوماتية (Informational)</text>
  <rect x="270" y="58" width="220" height="62" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="380" y="80" fill="#0f766e" font-weight="700" font-size="11" text-anchor="middle">الراصد (Monitor)</text>
  <text x="380" y="98" fill="#475569" font-size="10" text-anchor="middle">تتبع مجريات البيئة واستقبال</text>
  <text x="380" y="112" fill="#475569" font-size="10" text-anchor="middle">المعلومات والتقارير</text>
  <rect x="270" y="128" width="220" height="62" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="380" y="150" fill="#0f766e" font-weight="700" font-size="11" text-anchor="middle">ناشر البيانات (Disseminator)</text>
  <text x="380" y="168" fill="#475569" font-size="10" text-anchor="middle">إيصال البيانات الحيوية</text>
  <text x="380" y="182" fill="#475569" font-size="10" text-anchor="middle">إلى الكوادر في الداخل</text>
  <rect x="270" y="198" width="220" height="62" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="380" y="220" fill="#0f766e" font-weight="700" font-size="11" text-anchor="middle">المتحدث الرسمي (Spokesperson)</text>
  <text x="380" y="238" fill="#475569" font-size="10" text-anchor="middle">نقل مواقف المنظمة وخططها</text>
  <text x="380" y="252" fill="#475569" font-size="10" text-anchor="middle">إلى الأطراف الخارجية</text>
  <rect x="20" y="14" width="220" height="34" rx="8" fill="url(#g3)"/>
  <text x="130" y="36" fill="#ffffff" font-weight="800" font-size="12.5" text-anchor="middle">الأدوار القرارية (Decisional)</text>
  <rect x="20" y="58" width="220" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="80" fill="#b45309" font-weight="700" font-size="11" text-anchor="middle">المبادر الريادي (Entrepreneur)</text>
  <text x="130" y="98" fill="#475569" font-size="10" text-anchor="middle">البحث عن الفرص وإطلاق</text>
  <text x="130" y="112" fill="#475569" font-size="10" text-anchor="middle">مشروعات التغيير</text>
  <rect x="20" y="128" width="220" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="150" fill="#b45309" font-weight="700" font-size="11" text-anchor="middle">معالج الأزمات (Disturbance Handler)</text>
  <text x="130" y="168" fill="#475569" font-size="10" text-anchor="middle">تدارك الاضطرابات والمشكلات</text>
  <text x="130" y="182" fill="#475569" font-size="10" text-anchor="middle">الطارئة</text>
  <rect x="20" y="198" width="220" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="220" fill="#b45309" font-weight="700" font-size="11" text-anchor="middle">مخصص الموارد (Resource Allocator)</text>
  <text x="130" y="238" fill="#475569" font-size="10" text-anchor="middle">توزيع الميزانيات وتوجيه</text>
  <text x="130" y="252" fill="#475569" font-size="10" text-anchor="middle">الطاقات والوقت</text>
  <rect x="20" y="268" width="220" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="290" fill="#b45309" font-weight="700" font-size="11" text-anchor="middle">المفاوض (Negotiator)</text>
  <text x="130" y="308" fill="#475569" font-size="10" text-anchor="middle">الدفاع عن مصالح المنظمة</text>
  <text x="130" y="322" fill="#475569" font-size="10" text-anchor="middle">عند إبرام الاتفاقيات</text>
</svg>