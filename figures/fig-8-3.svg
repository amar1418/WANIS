<svg id="svg-exhibit-8-3" class="diagram-svg" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
  </defs>
  <rect x="390" y="14" width="350" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="42" fill="#1e3a8a" font-weight="800" font-size="13" text-anchor="middle">القيادة السلوكية (Behavioral)</text>
  <text x="565" y="72" fill="#334155" font-size="10" text-anchor="middle">• الاهتمام بالعلاقات الإنسانية</text>
  <text x="565" y="90" fill="#334155" font-size="10" text-anchor="middle">والثقة المتبادلة</text>
  <text x="565" y="118" fill="#334155" font-size="10" text-anchor="middle">• الاهتمام بالإنتاج وإنجاز</text>
  <text x="565" y="136" fill="#334155" font-size="10" text-anchor="middle">المهام</text>
  <text x="565" y="164" fill="#334155" font-size="10" text-anchor="middle">• شبكة القيادة الإدارية: دمج</text>
  <text x="565" y="182" fill="#334155" font-size="10" text-anchor="middle">البعدين في أنماط قيادية</text>
  <rect x="20" y="14" width="350" height="200" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="195" y="42" fill="#0f766e" font-weight="800" font-size="13" text-anchor="middle">القيادة الظرفية (Situational)</text>
  <text x="195" y="72" fill="#334155" font-size="10" text-anchor="middle">• جاهزية المرؤوسين: القدرة</text>
  <text x="195" y="90" fill="#334155" font-size="10" text-anchor="middle">والاستعداد والثقة</text>
  <text x="195" y="118" fill="#334155" font-size="10" text-anchor="middle">• مرونة النمط: تكييف القيادة</text>
  <text x="195" y="136" fill="#334155" font-size="10" text-anchor="middle">مع الموقف</text>
  <text x="195" y="164" fill="#334155" font-size="10" text-anchor="middle">• نماذج فيدلر وهرسي وبلانشارد</text>
  <text x="195" y="182" fill="#334155" font-size="10" text-anchor="middle">لربط النمط بالظروف</text>
  <rect x="230" y="232" width="300" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="249" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">(Behavioral vs. Situational Leadership)</text>
</svg>