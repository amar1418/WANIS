  <rect x="520" y="14" width="220" height="110" rx="10" fill="url(#g1)"/>
  <text x="630" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">1. الهيكل التنظيمي (Structure)</text>
  <text x="630" y="62" fill="#dbeafe" font-size="9.5" text-anchor="middle">تعديل قنوات السلطة ونطاق</text>
  <text x="630" y="78" fill="#dbeafe" font-size="9.5" text-anchor="middle">الإشراف والتصميم الوظيفي</text>
  <text x="630" y="94" fill="#dbeafe" font-size="9.5" text-anchor="middle">ومستوى اللامركزية</text>
  <rect x="270" y="14" width="220" height="110" rx="10" fill="url(#g2)"/>
  <text x="380" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">2. التقنية (Technology)</text>
  <text x="380" y="62" fill="#ccfbf1" font-size="9.5" text-anchor="middle">إدخال الأتمتة الحديثة</text>
  <text x="380" y="78" fill="#ccfbf1" font-size="9.5" text-anchor="middle">والأنظمة الرقمية وتعديل</text>
  <text x="380" y="94" fill="#ccfbf1" font-size="9.5" text-anchor="middle">أساليب وتدفقات الإنتاج</text>
  <rect x="20" y="14" width="220" height="110" rx="10" fill="url(#g3)"/>
  <text x="130" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">3. الأفراد وسلوكهم (People)</text>
  <text x="130" y="62" fill="#fef3c7" font-size="9.5" text-anchor="middle">تطوير الاتجاهات وصقل</text>
  <text x="130" y="78" fill="#fef3c7" font-size="9.5" text-anchor="middle">مهارات التواصل وتعديل</text>
  <text x="130" y="94" fill="#fef3c7" font-size="9.5" text-anchor="middle">التوقعات المهنية</text>
  <rect x="520" y="150" width="220" height="110" rx="10" fill="url(#g4)"/>
  <text x="630" y="176" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">بناء الفرق (Team Building)</text>
  <text x="630" y="198" fill="#ede9fe" font-size="9.5" text-anchor="middle">تعزيز الثقة البينية وتوحيد</text>
  <text x="630" y="214" fill="#ede9fe" font-size="9.5" text-anchor="middle">الغايات وتنمية روح</text>
  <text x="630" y="230" fill="#ede9fe" font-size="9.5" text-anchor="middle">التضامن والتعاون</text>
  <rect x="270" y="150" width="220" height="110" rx="10" fill="url(#g5)"/>
  <text x="380" y="176" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">المسح الاستقصائي</text>
  <text x="380" y="198" fill="#ffe4e6" font-size="9.5" text-anchor="middle">استطلاع آراء الموظفين</text>
  <text x="380" y="214" fill="#ffe4e6" font-size="9.5" text-anchor="middle">وتشخيص المشكلات السلوكية</text>
  <text x="380" y="230" fill="#ffe4e6" font-size="9.5" text-anchor="middle">والتنظيمية بشفافية</text>
