  <text x="130" y="198" fill="#f1f5f9" font-size="9.5" text-anchor="middle">تحليل مسارات العمل الميدانية</text>
  <text x="130" y="214" fill="#f1f5f9" font-size="9.5" text-anchor="middle">وعلاج خلل التنسيق عبر</text>
  <text x="130" y="230" fill="#f1f5f9" font-size="9.5" text-anchor="middle">مستشار متخصص</text>
  <text x="380" y="282" fill="#64748b" font-size="10.5" text-anchor="middle">(Three Types of Organizational Change + OD Techniques)</text>
