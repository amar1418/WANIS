<svg id="svg-exhibit-4-4" class="diagram-svg" viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <rect x="520" y="14" width="220" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="42" fill="#1e3a8a" font-weight="800" font-size="13" text-anchor="middle">1. رأس المال الفكري</text>
  <text x="630" y="60" fill="#2563eb" font-size="10.5" text-anchor="middle">(Intellectual)</text>
  <text x="630" y="86" fill="#334155" font-size="10" text-anchor="middle">المعرفة المتعمقة بقطاع</text>
  <text x="630" y="102" fill="#334155" font-size="10" text-anchor="middle">الأعمال العالمي، والقدرة</text>
  <text x="630" y="118" fill="#334155" font-size="10" text-anchor="middle">على استيعاب تشابك الأسواق</text>
  <text x="630" y="134" fill="#334155" font-size="10" text-anchor="middle">وفهم التحولات الدولية</text>
  <rect x="270" y="14" width="220" height="170" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="380" y="42" fill="#0f766e" font-weight="800" font-size="13" text-anchor="middle">2. رأس المال النفسي</text>
  <text x="380" y="60" fill="#0d9488" font-size="10.5" text-anchor="middle">(Psychological)</text>
  <text x="380" y="86" fill="#334155" font-size="10" text-anchor="middle">الشغف باكتشاف البيئات</text>
  <text x="380" y="102" fill="#334155" font-size="10" text-anchor="middle">الجديدة، والانفتاح الذهني</text>
  <text x="380" y="118" fill="#334155" font-size="10" text-anchor="middle">على التنوع، والشجاعة في</text>
  <text x="380" y="134" fill="#334155" font-size="10" text-anchor="middle">تقبل التغيير وخوض المجهول</text>
  <rect x="20" y="14" width="220" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="42" fill="#b45309" font-weight="800" font-size="13" text-anchor="middle">3. رأس المال الاجتماعي</text>
  <text x="130" y="60" fill="#f59e0b" font-size="10.5" text-anchor="middle">(Social)</text>
  <text x="130" y="86" fill="#334155" font-size="10" text-anchor="middle">القدرة الدبلوماسية على بناء</text>
  <text x="130" y="102" fill="#334155" font-size="10" text-anchor="middle">شبكات التعاون، وتأسيس</text>
  <text x="130" y="118" fill="#334155" font-size="10" text-anchor="middle">الثقة مع أفراد ينتمون إلى</text>
  <text x="130" y="134" fill="#334155" font-size="10" text-anchor="middle">خلفيات ثقافية متباينة</text>
  <rect x="230" y="204" width="300" height="36" rx="10" fill="#1e3a8a"/>
  <text x="380" y="227" fill="#ffffff" font-weight="700" font-size="11.5" text-anchor="middle">العقلية العالمية = فكري + نفسي + اجتماعي</text>
</svg>