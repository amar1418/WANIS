<svg id="svg-exhibit-6-4" class="diagram-svg" viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  </defs>
  <rect x="520" y="14" width="220" height="34" rx="8" fill="url(#g1)"/>
  <text x="630" y="36" fill="#334155" font-weight="800" font-size="12" text-anchor="middle">1. المستوى قبل التقليدي</text>
  <rect x="520" y="58" width="220" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="630" y="80" fill="#475569" font-size="10.5" text-anchor="middle">• تجنب العقاب البدني أو المالي</text>
  <text x="630" y="100" fill="#475569" font-size="10.5" text-anchor="middle">• السعي وراء المكافأة والمصلحة الذاتية</text>
  <rect x="520" y="132" width="220" height="34" rx="8" fill="#f1f5f9"/>
  <text x="630" y="154" fill="#64748b" font-size="10" text-anchor="middle">(Preconventional Level)</text>
  <rect x="270" y="14" width="220" height="34" rx="8" fill="url(#g2)"/>
  <text x="380" y="36" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">2. المستوى التقليدي</text>
  <rect x="270" y="58" width="220" height="64" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="380" y="80" fill="#0c4a6e" font-size="10.5" text-anchor="middle">• تلبية توقعات الأقران والأسرة</text>
  <text x="380" y="100" fill="#0c4a6e" font-size="10.5" text-anchor="middle">• الالتزام بالقوانين وحفظ النظام العام</text>
  <rect x="270" y="132" width="220" height="34" rx="8" fill="#f1f5f9"/>
  <text x="380" y="154" fill="#64748b" font-size="10" text-anchor="middle">(Conventional Level)</text>
  <rect x="20" y="14" width="220" height="34" rx="8" fill="url(#g3)"/>
  <text x="130" y="36" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">3. المستوى القائم على المبادئ</text>
  <rect x="20" y="58" width="220" height="64" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="130" y="80" fill="#064e3b" font-size="10.5" text-anchor="middle">• الاحتكام إلى مبادئ العدالة الكونية</text>
  <text x="130" y="100" fill="#064e3b" font-size="10.5" text-anchor="middle">• تقديم الحقوق الإنسانية على اللوائح</text>
  <rect x="20" y="132" width="220" height="34" rx="8" fill="#f1f5f9"/>
  <text x="130" y="154" fill="#64748b" font-size="10" text-anchor="middle">(Principled Level)</text>
  <path d="M 520 60 L 490 60" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 270 60 L 240 60" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="150" y="196" width="460" height="52" rx="10" fill="#1e3a8a"/>
  <text x="380" y="218" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">الأثر الإداري: ارتقاء القادة نحو مستوى المبادئ</text>
  <text x="380" y="238" fill="#dbeafe" font-size="10.5" text-anchor="middle">يرسخ مناخاً مؤسسياً عصياً على الفساد</text>
  <path d="M 130 166 L 130 196" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 380 166 L 380 196" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 630 166 L 630 196" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
