<svg id="svg-exhibit-2-3" class="diagram-svg" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <rect x="20" y="14" width="720" height="52" rx="10" fill="url(#g1)"/>
  <text x="380" y="36" fill="#ffffff" font-weight="800" font-size="13" text-anchor="middle">1. القرارات المستندة إلى الخبرة</text>
  <text x="380" y="56" fill="#dbeafe" font-size="10.5" text-anchor="middle">الاستناد إلى مخزون التجارب والنجاحات السابقة المتراكمة عبر المسيرة المهنية للمدير</text>
  <rect x="20" y="76" width="720" height="52" rx="10" fill="url(#g2)"/>
  <text x="380" y="98" fill="#ffffff" font-weight="800" font-size="13" text-anchor="middle">2. القرارات المستندة إلى الوجدان</text>
  <text x="380" y="118" fill="#eff6ff" font-size="10.5" text-anchor="middle">تأثير المشاعر والانطباعات النفسية المحفزة أو المحذرة من الخيار المطروح</text>
  <rect x="20" y="138" width="720" height="52" rx="10" fill="url(#g3)"/>
  <text x="380" y="160" fill="#ffffff" font-weight="800" font-size="13" text-anchor="middle">3. القرارات المستندة إلى القيم</text>
  <text x="380" y="180" fill="#f0f9ff" font-size="10.5" text-anchor="middle">الاحتكام إلى المنظومة القيمية والمبادئ الأخلاقية الراسخة وثقافة المنظمة</text>
  <rect x="20" y="200" width="720" height="52" rx="10" fill="url(#g4)"/>
  <text x="380" y="222" fill="#ffffff" font-weight="800" font-size="13" text-anchor="middle">4. القرارات المستندة إلى المهارات الإدراكية</text>
  <text x="380" y="242" fill="#ccfbf1" font-size="10.5" text-anchor="middle">استدعاء المعارف التخصصية والمهارات الفكرية المختزنة لحل المسائل المعقدة</text>
  <rect x="20" y="262" width="720" height="52" rx="10" fill="url(#g5)"/>
  <text x="380" y="284" fill="#ffffff" font-weight="800" font-size="13" text-anchor="middle">5. المعالجة العقلية اللاواعية</text>
  <text x="380" y="304" fill="#fef3c7" font-size="10.5" text-anchor="middle">استخدام العقل الباطن لتوليد روابط وحلول ذكية بين معطيات تبدو متباعدة ظاهرياً</text>
</svg>