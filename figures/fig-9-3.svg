  <path d="M 290 175 L 240 175" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 470 175 L 520 175" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
