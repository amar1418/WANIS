  <rect x="290" y="130" width="180" height="90" rx="12" fill="url(#gc)"/>
  <text x="380" y="162" fill="#ffffff" font-weight="800" font-size="13.5" text-anchor="middle">المنافسة في الصناعة</text>
  <text x="380" y="184" fill="#dbeafe" font-size="10.5" text-anchor="middle">(Industry Rivalry)</text>
  <text x="380" y="204" fill="#dbeafe" font-size="10" text-anchor="middle">شدة التنافس بين المنافسين الحاليين</text>
  <rect x="520" y="14" width="220" height="86" rx="10" fill="url(#g1)"/>
  <text x="630" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">الداخلون الجدد</text>
  <text x="630" y="62" fill="#ffe4e6" font-size="9.5" text-anchor="middle">(New Entrants)</text>
  <text x="630" y="80" fill="#ffe4e6" font-size="9.5" text-anchor="middle">حواجز الدخول وتهديد الوافدين</text>
  <rect x="20" y="14" width="220" height="86" rx="10" fill="url(#g2)"/>
  <text x="130" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">المنتجات البديلة</text>
  <text x="130" y="62" fill="#ccfbf1" font-size="9.5" text-anchor="middle">(Substitutes)</text>
  <text x="130" y="80" fill="#ccfbf1" font-size="9.5" text-anchor="middle">تهديد البدائل المتاحة للعميل</text>
  <rect x="520" y="250" width="220" height="86" rx="10" fill="url(#g3)"/>
  <text x="630" y="276" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">قوة المشترين</text>
  <text x="630" y="298" fill="#fef3c7" font-size="9.5" text-anchor="middle">(Buyer Power)</text>
  <text x="630" y="316" fill="#fef3c7" font-size="9.5" text-anchor="middle">قدرة العملاء على الضغط على الأسعار</text>
  <rect x="20" y="250" width="220" height="86" rx="10" fill="url(#g4)"/>
  <text x="130" y="276" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">قوة الموردين</text>
  <text x="130" y="298" fill="#ede9fe" font-size="9.5" text-anchor="middle">(Supplier Power)</text>
  <text x="130" y="316" fill="#ede9fe" font-size="9.5" text-anchor="middle">قدرة الموردين على رفع التكاليف</text>
  <rect x="290" y="14" width="180" height="86" rx="10" fill="url(#g5)"/>
  <text x="380" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">البدائل القريبة</text>
  <text x="380" y="62" fill="#f1f5f9" font-size="9.5" text-anchor="middle">(Threat of Substitutes)</text>
  <text x="380" y="80" fill="#f1f5f9" font-size="9.5" text-anchor="middle">منتجات خارجية تلبي الحاجة ذاتها</text>
