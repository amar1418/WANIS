<svg id="svg-exhibit-8-5" class="diagram-svg" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#be123c"/><stop offset="100%" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
  </defs>
  <rect x="520" y="14" width="220" height="200" rx="12" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="630" y="42" fill="#be123c" font-weight="800" font-size="12.5" text-anchor="middle">الأوتوقراطية (Autocratic)</text>
  <text x="630" y="72" fill="#334155" font-size="10" text-anchor="middle">• القرارات الفردية الحاسمة</text>
  <text x="630" y="96" fill="#334155" font-size="10" text-anchor="middle">• سلطة مركزية صارمة</text>
  <text x="630" y="120" fill="#334155" font-size="10" text-anchor="middle">• إملاء المهام دون استشارة</text>
  <text x="630" y="144" fill="#334155" font-size="10" text-anchor="middle">• مناسبة للأزمات والعمال</text>
  <text x="630" y="162" fill="#334155" font-size="10" text-anchor="middle">غير المهرة</text>
  <rect x="270" y="14" width="220" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="42" fill="#1e3a8a" font-weight="800" font-size="12.5" text-anchor="middle">الديمقراطية (Democratic)</text>
  <text x="380" y="72" fill="#334155" font-size="10" text-anchor="middle">• المشاركة في اتخاذ القرار</text>
  <text x="380" y="96" fill="#334155" font-size="10" text-anchor="middle">• التفويض وتوسيع الصلاحيات</text>
  <text x="380" y="120" fill="#334155" font-size="10" text-anchor="middle">• بناء الثقة والالتزام</text>
  <text x="380" y="144" fill="#334155" font-size="10" text-anchor="middle">• مناسبة للعمال المهرة</text>
  <text x="380" y="162" fill="#334155" font-size="10" text-anchor="middle">وذوي الخبرة</text>
  <rect x="20" y="14" width="220" height="200" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="130" y="42" fill="#0f766e" font-weight="800" font-size="12.5" text-anchor="middle">التسيبية (Laissez-Faire)</text>
  <text x="130" y="72" fill="#334155" font-size="10" text-anchor="middle">• الحرية الكاملة للمرؤوسين</text>
  <text x="130" y="96" fill="#334155" font-size="10" text-anchor="middle">• تدخل محدود من القائد</text>
  <text x="130" y="120" fill="#334155" font-size="10" text-anchor="middle">• الاعتماد على كفاءة الفريق</text>
  <text x="130" y="144" fill="#334155" font-size="10" text-anchor="middle">• مناسبة للفرق البحثية</text>
  <text x="130" y="162" fill="#334155" font-size="10" text-anchor="middle">والمهنية العالية</text>
  <rect x="230" y="232" width="300" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="249" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">(Three Leadership Styles)</text>
</svg>