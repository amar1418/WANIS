<svg id="svg-exhibit-3-3" class="diagram-svg" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#be123c"/><stop offset="100%" stop-color="#fb7185"/></linearGradient>
  </defs>
  <text x="380" y="18" fill="#1e3a8a" font-weight="800" font-size="12.5" text-anchor="middle">درجة التعقيد (Complexity)</text>
  <text x="700" y="150" fill="#1e3a8a" font-weight="800" font-size="12.5" text-anchor="middle" transform="rotate(90 700 150)">درجة الديناميكية (Dynamism)</text>
  <rect x="390" y="30" width="350" height="110" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="565" y="56" fill="#065f46" font-weight="800" font-size="12.5" text-anchor="middle">الخلية 1: مستقرة وبسيطة</text>
  <text x="565" y="80" fill="#334155" font-size="10" text-anchor="middle">تغير بطيء يمكن توقعه، عناصر بيئية</text>
  <text x="565" y="98" fill="#334155" font-size="10" text-anchor="middle">محدودة ومتشابهة</text>
  <rect x="430" y="104" width="270" height="24" rx="12" fill="url(#g1)"/>
  <text x="565" y="120" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">أدنى مستوى لعدم التأكد</text>
  <rect x="20" y="30" width="350" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="195" y="56" fill="#b45309" font-weight="800" font-size="12.5" text-anchor="middle">الخلية 2: ديناميكية وبسيطة</text>
  <text x="195" y="80" fill="#334155" font-size="10" text-anchor="middle">تغير سريع لا يمكن التنبؤ به، لكن</text>
  <text x="195" y="98" fill="#334155" font-size="10" text-anchor="middle">العناصر البيئية محدودة ومتشابهة</text>
  <rect x="60" y="104" width="270" height="24" rx="12" fill="url(#g2)"/>
  <text x="195" y="120" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">عدم تأكد متوسط</text>
  <rect x="390" y="160" width="350" height="110" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="565" y="186" fill="#6d28d9" font-weight="800" font-size="12.5" text-anchor="middle">الخلية 3: مستقرة ومعقدة</text>
  <text x="565" y="210" fill="#334155" font-size="10" text-anchor="middle">تغير بطيء، لكن العناصر البيئية</text>
  <text x="565" y="228" fill="#334155" font-size="10" text-anchor="middle">كثيرة ومتشابكة ومتباينة</text>
  <rect x="430" y="234" width="270" height="24" rx="12" fill="url(#g3)"/>
  <text x="565" y="250" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">عدم تأكد متوسط إلى مرتفع</text>
  <rect x="20" y="160" width="350" height="110" rx="10" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="195" y="186" fill="#be123c" font-weight="800" font-size="12.5" text-anchor="middle">الخلية 4: ديناميكية ومعقدة</text>
  <text x="195" y="210" fill="#334155" font-size="10" text-anchor="middle">تغير سريع وغير متوقع، مع عناصر</text>
  <text x="195" y="228" fill="#334155" font-size="10" text-anchor="middle">بيئية وفيرة وشديدة التباين</text>
  <rect x="60" y="234" width="270" height="24" rx="12" fill="url(#g4)"/>
  <text x="195" y="250" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">أقصى مستوى لعدم التأكد</text>
  <text x="380" y="292" fill="#64748b" font-size="10.5" text-anchor="middle">(Environmental Uncertainty Matrix)</text>
</svg>