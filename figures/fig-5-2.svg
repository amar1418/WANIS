<svg id="svg-exhibit-5-2" class="diagram-svg" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <rect x="520" y="14" width="220" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="42" fill="#1e3a8a" font-weight="800" font-size="12.5" text-anchor="middle">1. إدارة الكوادر والأفراد</text>
  <text x="630" y="72" fill="#334155" font-size="10" text-anchor="middle">• استقطاب أفضل المواهب</text>
  <text x="630" y="92" fill="#334155" font-size="10" text-anchor="middle">والاحتفاظ بها</text>
  <text x="630" y="116" fill="#334155" font-size="10" text-anchor="middle">• تحسين التماسك والروح</text>
  <text x="630" y="136" fill="#334155" font-size="10" text-anchor="middle">المعنوية للفرق</text>
  <text x="630" y="160" fill="#334155" font-size="10" text-anchor="middle">• تفعيل الطاقات الفردية</text>
  <text x="630" y="180" fill="#334155" font-size="10" text-anchor="middle">وإيقاد الحافز</text>
  <rect x="270" y="14" width="220" height="200" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="380" y="42" fill="#0f766e" font-weight="800" font-size="12.5" text-anchor="middle">2. الأداء المالي والتنظيمي</text>
  <text x="380" y="72" fill="#334155" font-size="10" text-anchor="middle">• تقليص تكاليف الغياب</text>
  <text x="380" y="92" fill="#334155" font-size="10" text-anchor="middle">ودوران العمل</text>
  <text x="380" y="116" fill="#334155" font-size="10" text-anchor="middle">• تجنب النزاعات القانونية</text>
  <text x="380" y="136" fill="#334155" font-size="10" text-anchor="middle">والتعويضات</text>
  <text x="380" y="160" fill="#334155" font-size="10" text-anchor="middle">• المرونة والقدرة الفائقة</text>
  <text x="380" y="180" fill="#334155" font-size="10" text-anchor="middle">على حل المشكلات</text>
  <rect x="20" y="14" width="220" height="200" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="42" fill="#b45309" font-weight="800" font-size="12.5" text-anchor="middle">3. المزايا الاستراتيجية</text>
  <text x="130" y="72" fill="#334155" font-size="10" text-anchor="middle">• استيعاب تفضيلات العملاء</text>
  <text x="130" y="92" fill="#334155" font-size="10" text-anchor="middle">المتنوعة</text>
  <text x="130" y="116" fill="#334155" font-size="10" text-anchor="middle">• إشعال جذوة الإبداع</text>
  <text x="130" y="136" fill="#334155" font-size="10" text-anchor="middle">وتجديد الأفكار</text>
  <text x="130" y="160" fill="#334155" font-size="10" text-anchor="middle">• بناء ميزة تنافسية دولية</text>
  <text x="130" y="180" fill="#334155" font-size="10" text-anchor="middle">ومحلية مستدامة</text>
  <rect x="230" y="232" width="300" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="249" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">(Benefits of Managing Workforce Diversity)</text>
</svg>