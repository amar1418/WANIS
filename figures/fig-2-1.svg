  <path d="M 195 183 L 175 183" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="230" y="248" width="300" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="268" fill="#1e3a8a" font-weight="700" font-size="11.5" text-anchor="middle">مسار متسلسل: من تشخيص المشكلة حتى تقييم النتائج</text>
  <text x="380" y="284" fill="#64748b" font-size="10" text-anchor="middle">(The Decision-Making Process)</text>
