  <path d="M 195 59 L 175 59" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M 90 102 L 90 130" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="575" y="140" width="170" height="86" rx="10" fill="url(#g4)"/>
  <text x="660" y="166" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">5. تحليل البدائل</text>
  <text x="660" y="186" fill="#ccfbf1" font-size="9.5" text-anchor="middle">تقييم كل خيار بميزان</text>
  <text x="660" y="202" fill="#ccfbf1" font-size="9.5" text-anchor="middle">المعايير</text>
  <rect x="385" y="140" width="170" height="86" rx="10" fill="url(#g3)"/>
  <text x="470" y="166" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">6. اختيار البديل</text>
  <text x="470" y="186" fill="#f0f9ff" font-size="9.5" text-anchor="middle">ترجيح الخيار ذي</text>
  <text x="470" y="202" fill="#f0f9ff" font-size="9.5" text-anchor="middle">التقييم الأعلى</text>
  <rect x="195" y="140" width="170" height="86" rx="10" fill="url(#g2)"/>
  <text x="280" y="166" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">7. إنفاذ القرار</text>
  <text x="280" y="186" fill="#eff6ff" font-size="9.5" text-anchor="middle">نقل الخيار إلى</text>
  <text x="280" y="202" fill="#eff6ff" font-size="9.5" text-anchor="middle">التطبيق والممارسة</text>
  <rect x="5" y="140" width="170" height="86" rx="10" fill="url(#g1)"/>
  <text x="90" y="166" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">8. تقييم الفاعلية</text>
  <text x="90" y="186" fill="#dbeafe" font-size="9.5" text-anchor="middle">التثبت من معالجة</text>
  <text x="90" y="202" fill="#dbeafe" font-size="9.5" text-anchor="middle">أصل المشكلة</text>
