  <text x="90" y="78" fill="#ccfbf1" font-size="9.5" text-anchor="middle">قابلة للتنفيذ</text>
  <path d="M 575 59 L 555 59" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
