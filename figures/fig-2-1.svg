    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="575" y="16" width="170" height="86" rx="10" fill="url(#g1)"/>
  <text x="660" y="42" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">1. تشخيص المشكلة</text>
  <text x="660" y="62" fill="#dbeafe" font-size="9.5" text-anchor="middle">رصد الفجوة بين الواقع</text>
  <text x="660" y="78" fill="#dbeafe" font-size="9.5" text-anchor="middle">والمأمول</text>
  <rect x="385" y="16" width="170" height="86" rx="10" fill="url(#g2)"/>
  <text x="470" y="42" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">2. تحديد المعايير</text>
  <text x="470" y="62" fill="#eff6ff" font-size="9.5" text-anchor="middle">حصر العوامل الحاكمة</text>
  <text x="470" y="78" fill="#eff6ff" font-size="9.5" text-anchor="middle">للاختيار</text>
