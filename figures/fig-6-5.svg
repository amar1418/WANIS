<svg id="svg-exhibit-6-5" class="diagram-svg" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect x="520" y="14" width="220" height="96" rx="10" fill="url(#g1)"/>
  <text x="630" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">1. التوظيف الأمين</text>
  <text x="630" y="62" fill="#dbeafe" font-size="9.5" text-anchor="middle">تحري النزاهة والقيم العالية</text>
  <text x="630" y="78" fill="#dbeafe" font-size="9.5" text-anchor="middle">في معايير استقطاب واختيار</text>
  <text x="630" y="94" fill="#dbeafe" font-size="9.5" text-anchor="middle">الموظفين الجدد</text>
  <rect x="270" y="14" width="220" height="96" rx="10" fill="url(#g2)"/>
  <text x="380" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">2. ميثاق الشرف الأخلاقي</text>
  <text x="380" y="62" fill="#eff6ff" font-size="9.5" text-anchor="middle">مدونة سلوك واضحة تحدد</text>
  <text x="380" y="78" fill="#eff6ff" font-size="9.5" text-anchor="middle">المعايير الإرشادية والمحظورات</text>
  <text x="380" y="94" fill="#eff6ff" font-size="9.5" text-anchor="middle">بدقة لا تقبل اللبس</text>
  <rect x="20" y="14" width="220" height="96" rx="10" fill="url(#g3)"/>
  <text x="130" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">3. قدوة الإدارة العليا</text>
  <text x="130" y="62" fill="#f0f9ff" font-size="9.5" text-anchor="middle">تجسيد القيادة الصادقة للقيم</text>
  <text x="130" y="78" fill="#f0f9ff" font-size="9.5" text-anchor="middle">النبيلة والنزاهة في القرارات</text>
  <text x="130" y="94" fill="#f0f9ff" font-size="9.5" text-anchor="middle">المصيرية كافة</text>
  <rect x="520" y="128" width="220" height="96" rx="10" fill="url(#g4)"/>
  <text x="630" y="154" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">4. التدريب الدوري المستمر</text>
  <text x="630" y="176" fill="#ccfbf1" font-size="9.5" text-anchor="middle">صقل بصائر الكوادر في تفكيك</text>
  <text x="630" y="192" fill="#ccfbf1" font-size="9.5" text-anchor="middle">المعضلات الأخلاقية ومواجهة</text>
  <text x="630" y="208" fill="#ccfbf1" font-size="9.5" text-anchor="middle">ضغوط العمل</text>
  <rect x="270" y="128" width="220" height="96" rx="10" fill="url(#g5)"/>
  <text x="380" y="154" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">5. التدقيق المستقل</text>
  <text x="380" y="176" fill="#fef3c7" font-size="9.5" text-anchor="middle">تقييم دوري محايد لسلامة</text>
  <text x="380" y="192" fill="#fef3c7" font-size="9.5" text-anchor="middle">الإجراءات والامتثال لمبادئ</text>
  <text x="380" y="208" fill="#fef3c7" font-size="9.5" text-anchor="middle">الحوكمة والشفافية</text>
  <rect x="20" y="128" width="220" height="96" rx="10" fill="url(#g6)"/>
  <text x="130" y="154" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">6. حماية المبلغين</text>
  <text x="130" y="176" fill="#ede9fe" font-size="9.5" text-anchor="middle">قنوات سرية تضمن حماية</text>
  <text x="130" y="192" fill="#ede9fe" font-size="9.5" text-anchor="middle">الشهود والمبلغين عن الفساد</text>
  <text x="130" y="208" fill="#ede9fe" font-size="9.5" text-anchor="middle">من أي ملاحقة كيدية</text>
</svg>