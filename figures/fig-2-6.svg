<svg id="svg-exhibit-2-6" class="diagram-svg" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="290" y="150" width="180" height="80" rx="12" fill="url(#gc)"/>
  <text x="380" y="182" fill="#ffffff" font-weight="800" font-size="13.5" text-anchor="middle">التحيزات الإدراكية</text>
  <text x="380" y="204" fill="#dbeafe" font-size="10.5" text-anchor="middle">أخطاء شائعة في صناعة القرار</text>
  <rect x="500" y="14" width="240" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="34" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">الثقة المفرطة (Overconfidence)</text>
  <text x="620" y="54" fill="#475569" font-size="9.5" text-anchor="middle">المبالغة في تقدير المعارف ودقة التنبؤ</text>
  <rect x="500" y="76" width="240" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="96" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">الانطباع الأولي (Anchoring)</text>
  <text x="620" y="116" fill="#475569" font-size="9.5" text-anchor="middle">الجمود عند المعلومة الأولى واعتمادها مقياساً</text>
  <rect x="500" y="138" width="240" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="158" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">الإدراك الانتقائي (Selective Perception)</text>
  <text x="620" y="178" fill="#475569" font-size="9.5" text-anchor="middle">رؤية الوقائع وفق الميول الشخصية</text>
  <rect x="500" y="200" width="240" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="220" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">تحيز التأكيد (Confirmation)</text>
  <text x="620" y="240" fill="#475569" font-size="9.5" text-anchor="middle">البحث عما يعضد الرأي المسبق وإهمال المعارض</text>
  <rect x="500" y="262" width="240" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="282" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">فخ التأطير (Framing Bias)</text>
  <text x="620" y="302" fill="#475569" font-size="9.5" text-anchor="middle">تأثر القرار بأسلوب عرض المشكلة وصياغتها</text>
  <rect x="500" y="324" width="240" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="344" fill="#1e3a8a" font-weight="700" font-size="11" text-anchor="middle">التوفر الذهني (Availability)</text>
  <text x="620" y="364" fill="#475569" font-size="9.5" text-anchor="middle">الاعتماد المفرط على الأحداث الحاضرة في الذاكرة</text>
  <rect x="20" y="14" width="240" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="140" y="34" fill="#0f766e" font-weight="700" font-size="11" text-anchor="middle">التمثيل النمطي (Representation)</text>
  <text x="140" y="54" fill="#475569" font-size="9.5" text-anchor="middle">إسقاط حكم تجربة سابقة على واقعة لتشابه عارض</text>
  <rect x="20" y="76" width="240" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="140" y="96" fill="#0f766e" font-weight="700" font-size="11" text-anchor="middle">التكاليف الغارقة (Sunk Costs)</text>
  <text x="140" y="116" fill="#475569" font-size="9.5" text-anchor="middle">مواصلة الإنفاق على مسار خاسر لتسويغ التكاليف</text>
  <rect x="20" y="138" width="240" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="140" y="158" fill="#0f766e" font-weight="700" font-size="11" text-anchor="middle">خدمة الذات (Self-Serving)</text>
  <text x="140" y="178" fill="#475569" font-size="9.5" text-anchor="middle">نسبة النجاح للذات ولوم الفشل على الخارج</text>
  <rect x="20" y="200" width="240" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="140" y="220" fill="#0f766e" font-weight="700" font-size="11" text-anchor="middle">النظرة البعدية (Hindsight Bias)</text>
  <text x="140" y="240" fill="#475569" font-size="9.5" text-anchor="middle">ادعاء معرفة النتيجة مسبقاً بعد حدوثها</text>
  <path d="M 380 150 L 380 66" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 150 L 380 128" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 150 L 380 190" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 150 L 380 252" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 150 L 380 314" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 150 L 380 376" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 150 L 260 66" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 150 L 260 128" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 150 L 260 190" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 150 L 260 252" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>