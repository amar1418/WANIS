  <rect x="270" y="140" width="220" height="80" rx="12" fill="url(#g1)"/>
  <text x="380" y="172" fill="#ffffff" font-weight="800" font-size="14" text-anchor="middle">العمل الإداري المعاصر</text>
  <text x="380" y="194" fill="#dbeafe" font-size="11" text-anchor="middle">قوى تعيد صياغة ممارسات الإدارة</text>
  <rect x="500" y="20" width="240" height="64" rx="10" fill="url(#g2)"/>
  <text x="620" y="46" fill="#ffffff" font-weight="700" font-size="11.5" text-anchor="middle">1. التحول الرقمي والذكاء الاصطناعي</text>
  <text x="620" y="66" fill="#ccfbf1" font-size="10" text-anchor="middle">فرق افتراضية وأتمتة ذكية وبيانات فورية</text>
  <rect x="500" y="276" width="240" height="64" rx="10" fill="url(#g3)"/>
  <text x="620" y="302" fill="#ffffff" font-weight="700" font-size="11.5" text-anchor="middle">2. حوكمة السلوك وأخلاقيات المهنة</text>
  <text x="620" y="322" fill="#fef3c7" font-size="10" text-anchor="middle">شفافية ونزاهة ومكافحة فساد ومسؤولية مجتمعية</text>
  <rect x="20" y="20" width="240" height="64" rx="10" fill="url(#g4)"/>
  <text x="140" y="46" fill="#ffffff" font-weight="700" font-size="11.5" text-anchor="middle">3. جودة خدمة العملاء</text>
  <text x="140" y="66" fill="#ede9fe" font-size="10" text-anchor="middle">رعاية تجربة العميل ركيزة البقاء في السوق</text>
  <rect x="20" y="276" width="240" height="64" rx="10" fill="url(#g5)"/>
  <text x="140" y="302" fill="#ffffff" font-weight="700" font-size="11.5" text-anchor="middle">4. استدامة الابتكار التنافسي</text>
  <text x="140" y="322" fill="#ffe4e6" font-size="10" text-anchor="middle">تفكير إبداعي وتجديد المنتجات ونماذج الأعمال</text>
  <rect x="260" y="20" width="240" height="64" rx="10" fill="#475569"/>
  <text x="380" y="46" fill="#ffffff" font-weight="700" font-size="11.5" text-anchor="middle">5. الاستدامة وحفظ الموارد</text>
  <text x="380" y="66" fill="#e2e8f0" font-size="10" text-anchor="middle">موازنة الطموحات الاقتصادية مع البيئة</text>
