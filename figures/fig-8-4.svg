  <text x="565" y="98" fill="#dbeafe" font-size="10" text-anchor="middle">(Organization's Overall Objectives)</text>
  <rect x="20" y="14" width="350" height="110" rx="10" fill="url(#g2)"/>
  <text x="195" y="40" fill="#ffffff" font-weight="800" font-size="12.5" text-anchor="middle">2. تطوير خطط العمل</text>
  <text x="195" y="62" fill="#eff6ff" font-size="10" text-anchor="middle">ترجمة الأهداف إلى خطط</text>
