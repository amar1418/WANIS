  <rect x="390" y="14" width="350" height="110" rx="10" fill="url(#g1)"/>
  <text x="565" y="40" fill="#ffffff" font-weight="800" font-size="12.5" text-anchor="middle">1. تحديد الأهداف العامة</text>
