  <text x="195" y="98" fill="#eff6ff" font-size="10" text-anchor="middle">(Developing Action Plans)</text>
  <rect x="390" y="176" width="350" height="110" rx="10" fill="url(#g3)"/>
  <text x="565" y="202" fill="#ffffff" font-weight="800" font-size="12.5" text-anchor="middle">3. مراجعة التقدم الدوري</text>
