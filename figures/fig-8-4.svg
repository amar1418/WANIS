  <text x="565" y="260" fill="#f0f9ff" font-size="10" text-anchor="middle">(Periodic Progress Review)</text>
  <rect x="20" y="176" width="350" height="110" rx="10" fill="url(#g4)"/>
  <text x="195" y="202" fill="#ffffff" font-weight="800" font-size="12.5" text-anchor="middle">4. تقييم الأداء النهائي</text>
