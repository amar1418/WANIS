  <text x="282" y="78" fill="#f0f9ff" font-size="9.5" text-anchor="middle">وإعلاء شأن تطلعاتهم</text>
  <text x="282" y="94" fill="#f0f9ff" font-size="9.5" text-anchor="middle">الإنسانية</text>
  <rect x="5" y="14" width="175" height="104" rx="10" fill="url(#g4)"/>
  <text x="92" y="40" fill="#ffffff" font-weight="800" font-size="11.5" text-anchor="middle">4. التوجه نحو الفريق</text>
