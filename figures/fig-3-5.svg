  <text x="282" y="162" fill="#ffffff" font-weight="800" font-size="11.5" text-anchor="middle">6. الاستقرار</text>
  <text x="282" y="184" fill="#ede9fe" font-size="9.5" text-anchor="middle">تفضيل الثبات المؤسسي</text>
