  <text x="472" y="40" fill="#ffffff" font-weight="800" font-size="11.5" text-anchor="middle">2. التوجه نحو النتائج</text>
  <text x="472" y="62" fill="#eff6ff" font-size="9.5" text-anchor="middle">تحكيم المقاصد وبلوغ</text>
