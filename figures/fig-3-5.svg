  <rect x="575" y="14" width="175" height="104" rx="10" fill="url(#g1)"/>
  <text x="662" y="40" fill="#ffffff" font-weight="800" font-size="11.5" text-anchor="middle">1. الاهتمام بالتفاصيل</text>
  <text x="662" y="62" fill="#dbeafe" font-size="9.5" text-anchor="middle">الدقة العالية والتركيز</text>
  <text x="662" y="78" fill="#dbeafe" font-size="9.5" text-anchor="middle">الصارم على الجزئيات</text>
