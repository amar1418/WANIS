<svg id="svg-exhibit-5-4" class="diagram-svg" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#be123c"/><stop offset="100%" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
  </defs>
  <rect x="520" y="14" width="220" height="100" rx="10" fill="url(#g1)"/>
  <text x="630" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">السياسات التمييزية (Policies)</text>
  <text x="630" y="62" fill="#ffe4e6" font-size="9.5" text-anchor="middle">إجراءات وظيفية غير منصفة تحرم</text>
  <text x="630" y="78" fill="#ffe4e6" font-size="9.5" text-anchor="middle">فئات معينة من الترقية أو الفرص</text>
  <text x="630" y="94" fill="#ffe4e6" font-size="9.5" text-anchor="middle">التدريبية العادلة</text>
  <rect x="270" y="14" width="220" height="100" rx="10" fill="url(#g2)"/>
  <text x="380" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">الترهيب والمضايقة (Intimidation)</text>
  <text x="380" y="62" fill="#fef3c7" font-size="9.5" text-anchor="middle">ممارسات عدائية تستهدف بث الخوف</text>
  <text x="380" y="78" fill="#fef3c7" font-size="9.5" text-anchor="middle">وإشعار موظفين محددين بالتهديد</text>
  <text x="380" y="94" fill="#fef3c7" font-size="9.5" text-anchor="middle">والاستضعاف</text>
  <rect x="20" y="14" width="220" height="100" rx="10" fill="url(#g3)"/>
  <text x="130" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">الاستهزاء والسخرية (Mockery)</text>
  <text x="130" y="62" fill="#ede9fe" font-size="9.5" text-anchor="middle">إطلاق النكات الجارحة أو التعليقات</text>
  <text x="130" y="78" fill="#ede9fe" font-size="9.5" text-anchor="middle">الساخرة على الخلفيات الثقافية</text>
  <text x="130" y="94" fill="#ede9fe" font-size="9.5" text-anchor="middle">أو المادية</text>
  <rect x="520" y="132" width="220" height="100" rx="10" fill="url(#g4)"/>
  <text x="630" y="158" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">الإقصاء والعزل (Exclusion)</text>
  <text x="630" y="180" fill="#ccfbf1" font-size="9.5" text-anchor="middle">حرمان كوادر من حضور الاجتماعات</text>
  <text x="630" y="196" fill="#ccfbf1" font-size="9.5" text-anchor="middle">المؤثرة أو المشاركة في فعاليات</text>
  <text x="630" y="212" fill="#ccfbf1" font-size="9.5" text-anchor="middle">العمل الحيوية</text>
  <rect x="270" y="132" width="220" height="100" rx="10" fill="url(#g5)"/>
  <text x="380" y="158" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">الفظاظة والعداء (Incivility)</text>
  <text x="380" y="180" fill="#dbeafe" font-size="9.5" text-anchor="middle">التعامل الفج وتجاهل الآراء</text>
  <text x="380" y="196" fill="#dbeafe" font-size="9.5" text-anchor="middle">وإظهار الاحتقار في التفاعلات</text>
  <text x="380" y="212" fill="#dbeafe" font-size="9.5" text-anchor="middle">المهنية اليومية</text>
  <rect x="20" y="132" width="220" height="100" rx="10" fill="url(#g6)"/>
  <text x="130" y="158" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">السقف الزجاجي (Glass Ceiling)</text>
  <text x="130" y="180" fill="#f1f5f9" font-size="9.5" text-anchor="middle">الحواجز الهيكلية الخفية التي تصد</text>
  <text x="130" y="196" fill="#f1f5f9" font-size="9.5" text-anchor="middle">الكفاءات عن بلوغ المراتب</text>
  <text x="130" y="212" fill="#f1f5f9" font-size="9.5" text-anchor="middle">القيادية العليا</text>
</svg>