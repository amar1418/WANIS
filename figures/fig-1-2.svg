<svg id="svg-exhibit-1-2" class="diagram-svg" viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  </defs>
  <rect x="390" y="14" width="350" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="44" fill="#1e3a8a" font-weight="800" font-size="14" text-anchor="middle">الكفاءة (Efficiency) — الوسائل (Means)</text>
  <text x="565" y="72" fill="#2563eb" font-weight="700" font-size="11.5" text-anchor="middle">الشعار: إنجاز الأمور على وجهها الصحيح (Doing Things Right)</text>
  <text x="565" y="98" fill="#334155" font-size="10.5" text-anchor="middle">المقصد: الاستغلال الأمثل للموارد وتقليل الهدر</text>
  <text x="565" y="120" fill="#334155" font-size="10.5" text-anchor="middle">في الوقت والمال والجهد البشري</text>
  <rect x="430" y="134" width="270" height="22" rx="11" fill="url(#g1)"/>
  <text x="565" y="149" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">التركيز: تقليل الهدر (Low Waste)</text>
  <rect x="20" y="14" width="350" height="150" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="195" y="44" fill="#065f46" font-weight="800" font-size="14" text-anchor="middle">الفاعلية (Effectiveness) — الغايات (Ends)</text>
  <text x="195" y="72" fill="#059669" font-weight="700" font-size="11.5" text-anchor="middle">الشعار: إنجاز الأمور الصحيحة ذات الأثر (Doing the Right Things)</text>
  <text x="195" y="98" fill="#334155" font-size="10.5" text-anchor="middle">المقصد: توجيه الأعمال صوب الأهداف الكبرى</text>
  <text x="195" y="120" fill="#334155" font-size="10.5" text-anchor="middle">وتحقيق النتائج الاستراتيجية دون انحراف</text>
  <rect x="60" y="134" width="270" height="22" rx="11" fill="url(#g2)"/>
  <text x="195" y="149" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">التركيز: إدراك الأهداف (High Goal Attainment)</text>
  <rect x="120" y="182" width="520" height="44" rx="10" fill="#1e3a8a"/>
  <text x="380" y="202" fill="#ffffff" font-weight="700" font-size="12" text-anchor="middle">الغاية الإدارية المثلى: إدارة رشيدة تجمع الكفاءة العالية (أدنى هدر)</text>
  <text x="380" y="219" fill="#dbeafe" font-size="10.5" text-anchor="middle">مع الفاعلية العالية (أعلى إنجاز للأهداف)</text>
</svg>