  <rect x="520" y="14" width="220" height="96" rx="10" fill="url(#g1)"/>
  <text x="630" y="40" fill="#ffffff" font-weight="800" font-size="12" text-anchor="middle">1. تحديد الرسالة والأهداف</text>
