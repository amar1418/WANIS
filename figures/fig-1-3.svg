<svg id="svg-exhibit-1-3" class="diagram-svg" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="290" y="14" width="180" height="88" rx="10" fill="url(#g1)"/>
  <text x="380" y="44" fill="#ffffff" font-weight="800" font-size="13.5" text-anchor="middle">1. التخطيط (Planning)</text>
  <text x="380" y="66" fill="#dbeafe" font-size="10.5" text-anchor="middle">تحديد الغايات ورسم الاستراتيجيات</text>
  <text x="380" y="84" fill="#dbeafe" font-size="10.5" text-anchor="middle">وتطوير خطط الأنشطة</text>
  <rect x="560" y="121" width="180" height="88" rx="10" fill="url(#g2)"/>
  <text x="650" y="151" fill="#ffffff" font-weight="800" font-size="13.5" text-anchor="middle">2. التنظيم (Organizing)</text>
  <text x="650" y="173" fill="#ccfbf1" font-size="10.5" text-anchor="middle">هندسة المهام وتوزيع المسؤوليات</text>
  <text x="650" y="191" fill="#ccfbf1" font-size="10.5" text-anchor="middle">وتفويض الصلاحيات</text>
  <rect x="290" y="228" width="180" height="88" rx="10" fill="url(#g3)"/>
  <text x="380" y="258" fill="#ffffff" font-weight="800" font-size="13.5" text-anchor="middle">3. القيادة (Leading)</text>
  <text x="380" y="280" fill="#d1fae5" font-size="10.5" text-anchor="middle">تحفيز الكوادر وتوجيه الأفراد</text>
  <text x="380" y="298" fill="#d1fae5" font-size="10.5" text-anchor="middle">وإدارة قنوات التواصل</text>
  <rect x="20" y="121" width="180" height="88" rx="10" fill="url(#g4)"/>
  <text x="110" y="151" fill="#ffffff" font-weight="800" font-size="13.5" text-anchor="middle">4. الرقابة (Controlling)</text>
  <text x="110" y="173" fill="#fef3c7" font-size="10.5" text-anchor="middle">رصد مجريات الأداء وتقييم النتائج</text>
  <text x="110" y="191" fill="#fef3c7" font-size="10.5" text-anchor="middle">وتصحيح الانحرافات</text>
  <circle cx="380" cy="165" r="54" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="380" y="160" fill="#1e3a8a" font-weight="800" font-size="12" text-anchor="middle">دورة الوظائف</text>
  <text x="380" y="178" fill="#1e3a8a" font-weight="800" font-size="12" text-anchor="middle">الإدارية</text>
  <path d="M 470 58 Q 560 58 560 121" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M 650 209 Q 650 228 470 228" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M 290 265 Q 200 265 200 209" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M 110 121 Q 110 58 290 58" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="180" y="318" width="400" height="0" rx="0" fill="none"/>
