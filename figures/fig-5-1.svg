<svg id="svg-exhibit-5-1" class="diagram-svg" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
  </defs>
  <rect x="390" y="14" width="350" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="42" fill="#1e3a8a" font-weight="800" font-size="13.5" text-anchor="middle">التنوع السطحي (Surface-Level)</text>
  <text x="565" y="68" fill="#334155" font-size="10.5" text-anchor="middle">الخصائص: فروق بيولوجية ومادية يسهل</text>
  <text x="565" y="86" fill="#334155" font-size="10.5" text-anchor="middle">رصدها بالعين (السن، الجنس، الإثنية)</text>
  <text x="565" y="114" fill="#334155" font-size="10.5" text-anchor="middle">التأثير: يستدعي القوالب النمطية مسبقاً،</text>
  <text x="565" y="132" fill="#334155" font-size="10.5" text-anchor="middle">لكن يضعف مع زيادة الاحتكاك المهني</text>
  <rect x="430" y="146" width="270" height="24" rx="12" fill="url(#g1)"/>
  <text x="565" y="162" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">المستوى: المظهر الخارجي والصفات المرئية</text>
  <rect x="20" y="14" width="350" height="170" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="195" y="42" fill="#0f766e" font-weight="800" font-size="13.5" text-anchor="middle">التنوع العميق (Deep-Level)</text>
  <text x="195" y="68" fill="#334155" font-size="10.5" text-anchor="middle">الخصائص: فروق باطنة جوهرية (المنظومة</text>
  <text x="195" y="86" fill="#334155" font-size="10.5" text-anchor="middle">القيمية، التوجهات الفكرية، سمات الشخصية)</text>
  <text x="195" y="114" fill="#334155" font-size="10.5" text-anchor="middle">التأثير: يحكم ديناميكيات التعاون الجماعي</text>
  <text x="195" y="132" fill="#334155" font-size="10.5" text-anchor="middle">والرضا والإنتاجية على المدى الطويل</text>
  <rect x="60" y="146" width="270" height="24" rx="12" fill="url(#g2)"/>
  <text x="195" y="162" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">المستوى: الهوية الفكرية والنفسية</text>
  <rect x="180" y="204" width="400" height="48" rx="10" fill="#1e3a8a"/>
  <text x="380" y="224" fill="#ffffff" font-weight="700" font-size="12" text-anchor="middle">الحقيقة الإدارية: المدير المقتدر يتجاوز المظاهر</text>
  <text x="380" y="242" fill="#dbeafe" font-size="10.5" text-anchor="middle">السطحية لتوظيف الطاقات الكامنة في التنوع العميق</text>
</svg>